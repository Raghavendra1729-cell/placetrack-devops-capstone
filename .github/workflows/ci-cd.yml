name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/raghavendra1729-cell

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -v
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: frontend

  image:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ env.REGISTRY }}/placetrack-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/placetrack-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker push ${{ env.REGISTRY }}/placetrack-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, macOS, placetrack]
    permissions:
      contents: read
    env:
      KUBE_CONTEXT: placetrack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # helm and kubectl are in /opt/homebrew/bin on my Mac
      - run: echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: Deploy the new image with Helm
        run: scripts/deploy.sh "$GITHUB_SHA"
      - name: Wait for the rollout
        run: |
          kubectl --context "$KUBE_CONTEXT" -n placetrack rollout status deploy/placetrack-backend --timeout=180s
          kubectl --context "$KUBE_CONTEXT" -n placetrack rollout status deploy/placetrack-frontend --timeout=180s
      - name: Show pods
        run: kubectl --context "$KUBE_CONTEXT" -n placetrack get pods
