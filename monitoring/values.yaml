prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 6h
    resources: { requests: { cpu: 100m, memory: 400Mi } }
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards: { enabled: true, label: grafana_dashboard }
alertmanager:
  enabled: false
