services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: placetrack
      POSTGRES_PASSWORD: placetrack
      POSTGRES_DB: placetrack
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placetrack"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://placetrack:placetrack@postgres:5432/placetrack
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:8080"]

volumes:
  pgdata:
