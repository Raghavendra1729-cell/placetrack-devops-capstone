{{- $name := printf "%s-db" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    # Keep the generated password when the release is uninstalled, because the database volume keeps the old one.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  password: {{ index $existing.data "password" }}
  database-url: {{ index $existing.data "database-url" }}
  {{- else }}
  {{- $pw := randAlphaNum 24 }}
  password: {{ $pw | b64enc }}
  database-url: {{ printf "postgresql+psycopg://placetrack:%s@%s-postgres:5432/placetrack" $pw .Release.Name | b64enc }}
  {{- end }}
