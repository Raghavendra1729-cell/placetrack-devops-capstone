{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: placetrack, app.kubernetes.io/component: backend }
  endpoints:
    - { port: http, path: /metrics, interval: 15s }
{{- end }}
