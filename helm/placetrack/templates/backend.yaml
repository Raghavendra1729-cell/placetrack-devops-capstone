apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: placetrack, app.kubernetes.io/component: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: placetrack, app.kubernetes.io/component: backend }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: backend
          image: {{ .Values.image.registry }}/placetrack-backend:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-db, key: database-url } }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels: { app.kubernetes.io/name: placetrack, app.kubernetes.io/component: backend }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: placetrack, app.kubernetes.io/component: backend }
  ports: [{ name: http, port: 8000, targetPort: http }]
